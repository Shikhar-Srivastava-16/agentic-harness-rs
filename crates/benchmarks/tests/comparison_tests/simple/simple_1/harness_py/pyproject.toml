[project]
name = "llms-vs-langchain-bench"
version = "0.1.0"
requires-python = ">=3.11"
description = "Benchmark comparing the llms Rust crate vs Python LangChain"
dependencies = [
    "langchain>=0.3",
    "langchain-ollama>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "langchain-classic>=1.0.8",
    "numpy>=2.2.6",
]

[project.scripts]
harness_langchain = "harness_langchain:main"
compare = "compare:main"

[tool.uv]
package = false
