[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive", "env"] }
colored_text = "0.5.1"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ab_glyph"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
version-compare = "0.2.1"
walkdir = "2.5.0"

[build-dependencies]
walkdir = "2.5.0"
version_check = "0.9.5"

[[bin]]
name = "data_aggregate"
path = "src/data_aggregate.rs"
